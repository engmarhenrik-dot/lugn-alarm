name: Bygg APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - name: Publicera som release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk lugn-alarm.apk
          gh release delete senaste --yes --cleanup-tag || true
          gh release create senaste lugn-alarm.apk --title "Lugn alarm (senaste bygget)" --notes "Ladda ner lugn-alarm.apk och installera."
